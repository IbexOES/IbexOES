<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Payment Management Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #2563eb;
            --accent: #d97706;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success: #16a34a;
            --danger: #dc2626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Login Screen */
        #login-screen {
            max-width: 400px;
            margin: 8rem auto;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            text-align: center;
            border: 1px solid var(--border-color);
        }

        #login-screen h2 {
            color: var(--primary);
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--secondary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--secondary);
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 0.75rem;
            display: none;
        }

        /* Dashboard Screen */
        #dashboard-screen {
            display: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 1.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--primary);
        }

        .logout-btn {
            background: var(--danger);
            width: auto;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }

        @media(max-width: 850px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
        }

        .card h3 {
            font-size: 1.15rem;
            color: var(--primary);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--bg-color);
        }

        /* Table Styles */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 0.85rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: var(--bg-color);
            color: var(--primary);
            font-weight: 600;
        }

        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-paid { background: #dcfce7; color: var(--success); }
        .badge-pending { background: #fef9c3; color: #a16207; }
        .badge-overdue { background: #fee2e2; color: var(--danger); }

        .action-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1rem;
            width: auto;
            padding: 0;
        }
        .action-btn:hover { color: #991b1b; background: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGIN SCREEN -->
        <div id="login-screen">
            <h2><i class="fas fa-lock"></i> Portal Login</h2>
            <div class="form-group">
                <label>Enter Security Code</label>
                <input type="password" id="passcode-input" placeholder="Enter code..." />
            </div>
            <button onclick="handleLogin()">Access Dashboard</button>
            <p id="login-error" class="error-msg">Incorrect access code. Please try again.</p>
        </div>

        <!-- DASHBOARD SCREEN -->
        <div id="dashboard-screen">
            <header>
                <h1><i class="fas fa-graduation-cap"></i> Student & Payment Records</h1>
                <button class="logout-btn" onclick="handleLogout()">Logout</button>
            </header>

            <div class="dashboard-grid">
                <!-- Add Student Form -->
                <div>
                    <div class="card">
                        <h3>Add New Student</h3>
                        <form id="student-form" onsubmit="addStudent(event)">
                            <div class="form-group">
                                <label>Student Name</label>
                                <input type="text" id="name" required placeholder="e.g. John Doe">
                            </div>
                            <div class="form-group">
                                <label>Course / Program</label>
                                <input type="text" id="course" required placeholder="e.g. Web Development">
                            </div>
                            <div class="form-group">
                                <label>Total Package Amount ($)</label>
                                <input type="number" id="total_package" required placeholder="500">
                            </div>
                            <div class="form-group">
                                <label>Installments Paid ($)</label>
                                <input type="number" id="paid_amount" required placeholder="200">
                            </div>
                            <div class="form-group">
                                <label>Status</label>
                                <select id="status">
                                    <option value="Paid">Fully Paid</option>
                                    <option value="Pending" selected>Pending Installments</option>
                                    <option value="Overdue">Overdue</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Remarks / Notes</label>
                                <textarea id="remarks" rows="2" placeholder="Next payment due next month..."></textarea>
                            </div>
                            <button type="submit">Save Student Record</button>
                        </form>
                    </div>
                </div>

                <!-- Student Records Table -->
                <div>
                    <div class="card">
                        <h3>Registered Students & Payments</h3>
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Name / Course</th>
                                        <th>Package</th>
                                        <th>Paid</th>
                                        <th>Pending</th>
                                        <th>Status</th>
                                        <th>Remarks</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="student-table-body">
                                    <!-- Dynamic rows populate here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CORRECT_CODE = "51214";

        // Check if already logged in during this browser session
        window.onload = function() {
            if(sessionStorage.getItem("isLoggedIn") === "true") {
                showDashboard();
            }
        };

        function handleLogin() {
            const inputVal = document.getElementById("passcode-input").value;
            const errorMsg = document.getElementById("login-error");

            if(inputVal === CORRECT_CODE) {
                sessionStorage.setItem("isLoggedIn", "true");
                showDashboard();
            } else {
                errorMsg.style.display = "block";
            }
        }

        function handleLogout() {
            sessionStorage.removeItem("isLoggedIn");
            document.getElementById("dashboard-screen").style.display = "none";
            document.getElementById("login-screen").style.display = "block";
            document.getElementById("passcode-input").value = "";
        }

        function showDashboard() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("dashboard-screen").style.display = "block";
            loadStudents();
        }

        // Student Data Operations using localStorage
        function getStudents() {
            return JSON.parse(localStorage.getItem("github_students")) || [];
        }

        function saveStudents(students) {
            localStorage.setItem("github_students", JSON.stringify(students));
        }

        function addStudent(e) {
            e.preventDefault();
            const name = document.getElementById("name").value;
            const course = document.getElementById("course").value;
            const total_package = parseFloat(document.getElementById("total_package").value);
            const paid_amount = parseFloat(document.getElementById("paid_amount").value);
            const status = document.getElementById("status").value;
            const remarks = document.getElementById("remarks").value;

            const students = getStudents();
            students.push({ id: Date.now(), name, course, total_package, paid_amount, status, remarks });
            
            saveStudents(students);
            document.getElementById("student-form").reset();
            loadStudents();
        }

        function deleteStudent(id) {
            let students = getStudents();
            students = students.filter(s => s.id !== id);
            saveStudents(students);
            loadStudents();
        }

        function loadStudents() {
            const students = getStudents();
            const tbody = document.getElementById("student-table-body");
            tbody.innerHTML = "";

            if(students.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #64748b;">No student records found. Add one using the form.</td></tr>`;
                return;
            }

            students.forEach(s => {
                const pending = s.total_package - s.paid_amount;
                let badgeClass = "badge-pending";
                if(s.status === "Paid") badgeClass = "badge-paid";
                if(s.status === "Overdue") badgeClass = "badge-overdue";

                const row = document.createElement("tr");
                row.innerHTML = `
                    <td><strong>${s.name}</strong><br><small style="color: #64748b;">${s.course}</small></td>
                    <td>$${s.total_package}</td>
                    <td>$${s.paid_amount}</td>
                    <td><strong>$${pending >= 0 ? pending : 0}</strong></td>
                    <td><span class="badge ${badgeClass}">${s.status}</span></td>
                    <td><small>${s.remarks || 'None'}</small></td>
                    <td><button class="action-btn" onclick="deleteStudent(${s.id})"><i class="fas fa-trash"></i></button></td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
