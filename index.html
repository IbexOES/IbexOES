<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Student Payment Management Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #2563eb;
            --accent: #d97706;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success: #16a34a;
            --danger: #dc2626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Login Screen */
        #login-screen {
            max-width: 400px;
            margin: 8rem auto;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            text-align: center;
            border: 1px solid var(--border-color);
        }

        #login-screen h2 {
            color: var(--primary);
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--secondary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--secondary);
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 0.75rem;
            display: none;
        }

        /* Dashboard Screen */
        #dashboard-screen {
            display: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 1.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--primary);
        }

        .logout-btn {
            background: var(--danger);
            width: auto;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 2.2fr;
            gap: 2rem;
        }

        @media(max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
        }

        .card h3 {
            font-size: 1.15rem;
            color: var(--primary);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--bg-color);
        }

        /* Table Styles */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 0.85rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: var(--bg-color);
            color: var(--primary);
            font-weight: 600;
        }

        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-paid { background: #dcfce7; color: var(--success); }
        .badge-pending { background: #fef9c3; color: #a16207; }
        .badge-overdue { background: #fee2e2; color: var(--danger); }

        .btn-action-group {
            display: flex;
            gap: 0.5rem;
        }

        .btn-edit {
            background: var(--secondary);
            font-size: 0.8rem;
            padding: 0.35rem 0.6rem;
            width: auto;
        }

        .btn-delete {
            background: var(--danger);
            font-size: 0.8rem;
            padding: 0.35rem 0.6rem;
            width: auto;
        }

        /* Modal Window */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 1rem;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            max-width: 550px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
            width: auto;
        }

        .history-list {
            margin-top: 1rem;
            background: var(--bg-color);
            padding: 1rem;
            border-radius: 8px;
            max-height: 150px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            padding: 0.35rem 0;
            border-bottom: 1px dashed var(--border-color);
        }

        .loading-spinner {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGIN SCREEN -->
        <div id="login-screen">
            <h2><i class="fas fa-lock"></i> Portal Login</h2>
            <div class="form-group">
                <label>Enter Security Code</label>
                <input type="password" id="passcode-input" placeholder="Enter code..." />
            </div>
            <button onclick="handleLogin()">Access Dashboard</button>
            <p id="login-error" class="error-msg">Incorrect access code. Please try again.</p>
        </div>

        <!-- DASHBOARD SCREEN -->
        <div id="dashboard-screen">
            <header>
                <h1><i class="fas fa-globe"></i> Global Cloud Student Portal</h1>
                <button class="logout-btn" onclick="handleLogout()">Logout</button>
            </header>

            <div class="dashboard-grid">
                <!-- Add Student Form -->
                <div>
                    <div class="card">
                        <h3>Add New Student</h3>
                        <form id="student-form" onsubmit="addStudent(event)">
                            <div class="form-group">
                                <label>Student Name</label>
                                <input type="text" id="name" required placeholder="e.g. John Doe">
                            </div>
                            <div class="form-group">
                                <label>Course / Program</label>
                                <input type="text" id="course" required placeholder="e.g. Web Development">
                            </div>
                            <div class="form-group">
                                <label>Total Package Amount ($)</label>
                                <input type="number" id="total_package" required placeholder="500">
                            </div>
                            <div class="form-group">
                                <label>Initial Installment Paid ($)</label>
                                <input type="number" id="paid_amount" required placeholder="100">
                            </div>
                            <div class="form-group">
                                <label>Status</label>
                                <select id="status">
                                    <option value="Pending" selected>Pending Installments</option>
                                    <option value="Paid">Fully Paid</option>
                                    <option value="Overdue">Overdue</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Remarks / Notes</label>
                                <textarea id="remarks" rows="2" placeholder="Notes on payment..."></textarea>
                            </div>
                            <button type="submit">Save Student Record</button>
                        </form>
                    </div>
                </div>

                <!-- Student Records Table -->
                <div>
                    <div class="card">
                        <h3>Registered Students & Payments</h3>
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Name / Course</th>
                                        <th>Total</th>
                                        <th>Paid</th>
                                        <th>Pending</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="student-table-body">
                                    <tr><td colspan="6" class="loading-spinner">Connecting to cloud storage...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- INSTALLMENT & EDIT MODAL WINDOW -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-student-name">Manage Payments</h3>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>

            <!-- Add New Installment Section -->
            <div style="background: #eff6ff; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; border: 1px solid #bfdbfe;">
                <h4 style="color: var(--primary); font-size: 0.95rem; margin-bottom: 0.5rem;"><i class="fas fa-plus-circle"></i> Add New Installment</h4>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="number" id="new-installment-amount" placeholder="Amount ($)" style="background: white;">
                    <button onclick="addInstallmentPayment()" style="width: auto; white-space: nowrap; background: var(--success);">Add Payment</button>
                </div>
            </div>

            <!-- Installments History Log -->
            <h4 style="font-size: 0.9rem; color: var(--text-muted);"><i class="fas fa-history"></i> Payment History</h4>
            <div class="history-list" id="payment-history-list">
                <!-- History Items go here -->
            </div>

            <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid var(--border-color);">

            <!-- Full Edit Form -->
            <h4 style="font-size: 0.95rem; color: var(--primary); margin-bottom: 1rem;"><i class="fas fa-edit"></i> Edit Record Details</h4>
            <input type="hidden" id="edit-student-id">
            
            <div class="form-group">
                <label>Total Package Amount ($)</label>
                <input type="number" id="edit-total-package">
            </div>
            <div class="form-group">
                <label>Payment Status</label>
                <select id="edit-status">
                    <option value="Pending">Pending Installments</option>
                    <option value="Paid">Fully Paid</option>
                    <option value="Overdue">Overdue</option>
                </select>
            </div>
            <div class="form-group">
                <label>Remarks / Notes</label>
                <textarea id="edit-remarks" rows="2"></textarea>
            </div>

            <button onclick="saveStudentEdits()">Update Student Record</button>
        </div>
    </div>

    <script>
        // ========================================================
        // YOUR JSONBIN.IO CONFIGURATION
        // ========================================================
        const JSONBIN_BIN_ID = "6ace2f11ac6210605a2da73f";
        const JSONBIN_API_KEY = "$2a$10$8cB1mLPEgn1Dtm/d.bTbbu/7urXUJ9VnLJfP1fWxFZXR2INglNptW";

        const CORRECT_CODE = "51214";
        let studentsCache = [];

        window.onload = function() {
            if(sessionStorage.getItem("isLoggedIn") === "true") {
                showDashboard();
            }
        };

        function handleLogin() {
            const inputVal = document.getElementById("passcode-input").value.trim();
            const errorMsg = document.getElementById("login-error");

            if(inputVal === CORRECT_CODE) {
                sessionStorage.setItem("isLoggedIn", "true");
                showDashboard();
            } else {
                errorMsg.style.display = "block";
            }
        }

        function handleLogout() {
            sessionStorage.removeItem("isLoggedIn");
            document.getElementById("dashboard-screen").style.display = "none";
            document.getElementById("login-screen").style.display = "block";
            document.getElementById("passcode-input").value = "";
        }

        function showDashboard() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("dashboard-screen").style.display = "block";
            fetchStudentsFromCloud();
        }

        // Fetch Data from JSONBin Cloud
        async function fetchStudentsFromCloud() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });
                const data = await response.json();
                studentsCache = Array.isArray(data.record) ? data.record : [];
                renderTable();
            } catch (err) {
                console.error("Error fetching from cloud:", err);
                document.getElementById("student-table-body").innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--danger);">Failed to load cloud data. Please check connection.</td></tr>`;
            }
        }

        // Save Data to JSONBin Cloud
        async function saveStudentsToCloud(updatedStudents) {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_API_KEY
                    },
                    body: JSON.stringify(updatedStudents)
                });
                studentsCache = updatedStudents;
                renderTable();
            } catch (err) {
                alert("Error saving to cloud: " + err.message);
            }
        }

        async function addStudent(e) {
            e.preventDefault();
            const name = document.getElementById("name").value;
            const course = document.getElementById("course").value;
            const total_package = parseFloat(document.getElementById("total_package").value);
            const initial_payment = parseFloat(document.getElementById("paid_amount").value);
            const status = document.getElementById("status").value;
            const remarks = document.getElementById("remarks").value;
            const dateStr = new Date().toLocaleDateString();

            const newStudent = { 
                id: Date.now(), 
                name, 
                course, 
                total_package, 
                paid_amount: initial_payment, 
                status, 
                remarks,
                history: [{ date: dateStr, amount: initial_payment }]
            };

            const updated = [...studentsCache, newStudent];
            await saveStudentsToCloud(updated);
            document.getElementById("student-form").reset();
        }

        async function deleteStudent(id) {
            if(confirm("Are you sure you want to delete this student record globally?")) {
                const updated = studentsCache.filter(s => s.id !== id);
                await saveStudentsToCloud(updated);
            }
        }

        function renderTable() {
            const tbody = document.getElementById("student-table-body");
            tbody.innerHTML = "";

            if(studentsCache.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #64748b;">No student records found in cloud. Add one using the form.</td></tr>`;
                return;
            }

            studentsCache.forEach(s => {
                const pending = s.total_package - s.paid_amount;
                let badgeClass = "badge-pending";
                if(s.status === "Paid") badgeClass = "badge-paid";
                if(s.status === "Overdue") badgeClass = "badge-overdue";

                const row = document.createElement("tr");
                row.innerHTML = `
                    <td><strong>${s.name}</strong><br><small style="color: #64748b;">${s.course}</small></td>
                    <td>$${s.total_package}</td>
                    <td>$${s.paid_amount}</td>
                    <td><strong style="color: ${pending > 0 ? 'var(--danger)' : 'var(--success)'}">$${pending >= 0 ? pending : 0}</strong></td>
                    <td><span class="badge ${badgeClass}">${s.status}</span></td>
                    <td>
                        <div class="btn-action-group">
                            <button class="btn-edit" onclick="openModal(${s.id})"><i class="fas fa-coins"></i> Edit / Installment</button>
                            <button class="btn-delete" onclick="deleteStudent(${s.id})"><i class="fas fa-trash"></i></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        /* Modal Operations */
        function openModal(id) {
            const student = studentsCache.find(s => s.id === id);
            if(!student) return;

            document.getElementById("edit-student-id").value = student.id;
            document.getElementById("modal-student-name").innerText = `Manage: ${student.name}`;
            document.getElementById("edit-total-package").value = student.total_package;
            document.getElementById("edit-status").value = student.status;
            document.getElementById("edit-remarks").value = student.remarks || "";

            const historyList = document.getElementById("payment-history-list");
            historyList.innerHTML = "";

            if(!student.history || student.history.length === 0) {
                historyList.innerHTML = `<div style="text-align:center; color:#64748b; font-size:0.85rem;">No payment history recorded yet.</div>`;
            } else {
                student.history.forEach((h, index) => {
                    const item = document.createElement("div");
                    item.className = "history-item";
                    item.innerHTML = `<span>Installment ${index + 1} (${h.date})</span> <strong>+$${h.amount}</strong>`;
                    historyList.appendChild(item);
                });
            }

            document.getElementById("edit-modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("edit-modal").style.display = "none";
            document.getElementById("new-installment-amount").value = "";
            fetchStudentsFromCloud(); // Refresh data on close
        }

        async function addInstallmentPayment() {
            const studentId = parseInt(document.getElementById("edit-student-id").value);
            const amountInput = document.getElementById("new-installment-amount");
            const newAmount = parseFloat(amountInput.value);

            if(isNaN(newAmount) || newAmount <= 0) {
                alert("Please enter a valid installment amount.");
                return;
            }

            const updated = studentsCache.map(s => {
                if(s.id === studentId) {
                    const updatedPaid = s.paid_amount + newAmount;
                    const dateStr = new Date().toLocaleDateString();
                    const updatedHistory = s.history ? [...s.history, { date: dateStr, amount: newAmount }] : [{ date: dateStr, amount: newAmount }];
                    let updatedStatus = s.status;
                    if(updatedPaid >= s.total_package) updatedStatus = "Paid";

                    return { ...s, paid_amount: updatedPaid, history: updatedHistory, status: updatedStatus };
                }
                return s;
            });

            await saveStudentsToCloud(updated);
            openModal(studentId);
            amountInput.value = "";
        }

        async function saveStudentEdits() {
            const studentId = parseInt(document.getElementById("edit-student-id").value);
            const total_package = parseFloat(document.getElementById("edit-total-package").value);
            const status = document.getElementById("edit-status").value;
            const remarks = document.getElementById("edit-remarks").value;

            const updated = studentsCache.map(s => {
                if(s.id === studentId) {
                    return { ...s, total_package, status, remarks };
                }
                return s;
            });

            await saveStudentsToCloud(updated);
            closeModal();
        }
    </script>
</body>
</html>
